name: Provenance Guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Provenance Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test guard
        run: bash .github/scripts/test-provenance-guard.sh

      - name: Scan repository and pull request text
        run: .github/scripts/check-provenance-markers.sh .
