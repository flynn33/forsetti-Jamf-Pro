name: macOS validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Xcode tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: forsetti-Jamf-Pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: forsetti-Jamf-Pro

      - name: Checkout Forsetti framework
        uses: actions/checkout@v4
        with:
          repository: flynn33/Forsetti-Framework
          ref: main
          path: Forsetti-Framework-Mac-iOS-main

      - name: Sanitation scan
        run: bash scripts/verify-no-customer-references.sh .

      - name: Resolve project
        run: xcodebuild -list -project Forsetti.xcodeproj

      - name: Test
        run: >
          xcodebuild
          -project Forsetti.xcodeproj
          -scheme Forsetti
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test
