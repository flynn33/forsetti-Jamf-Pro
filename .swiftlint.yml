# SwiftLint configuration for the Forsetti Jamf Pro project.
#
# Philosophy: flag genuine correctness/readability issues, not style
# preferences. The codebase has verbose doc comments by design, long
# files for cohesive modules, and per-module error-mapping patterns
# that would trigger noisy lint warnings under default rules without
# indicating a real problem. Customized accordingly.

# Directories the linter should skip.
excluded:
  - .build
  - .swiftpm
  - build
  - DerivedData
  - Carthage
  - Pods
  - .github
  - Standalone

# Rule set.
disabled_rules:
  # The app intentionally uses descriptive identifiers and block comments
  # in places where SwiftLint's default style rules would flag them.
  - todo                     # TODO/FIXME comments are useful as-is
  - trailing_whitespace      # handled by editors; churn-only warning
  - line_length              # long filter/URL literals + long docstrings

opt_in_rules:
  - empty_count                    # prefer isEmpty over .count == 0
  - closure_end_indentation
  - closure_spacing
  - explicit_init
  - fatal_error_message            # disallow unhelpful fatalError() strings
  - first_where                    # prefer .first(where:) over .filter().first
  - contains_over_filter_is_empty
  - contains_over_filter_count
  - contains_over_first_not_nil
  - force_unwrapping               # catch accidental `!` usage
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - override_in_extension
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

# Per-rule configuration.
identifier_name:
  min_length: 2                     # `id` is fine; `a` usually isn't
  max_length:
    warning: 60
    error: 80

type_name:
  min_length: 3
  max_length:
    warning: 60
    error: 80

function_body_length:
  warning: 120                      # many Jamf API functions legitimately long
  error: 200

type_body_length:
  warning: 600                      # view models / services are big
  error: 900

file_length:
  warning: 2500
  error: 3500

cyclomatic_complexity:
  warning: 20                       # fallback chains unavoidably branching
  error: 40

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 5

force_unwrapping:
  severity: warning                 # warn rather than error — migration

reporter: "xcode"
